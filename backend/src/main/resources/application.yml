server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: energy-consumption-forecasting
  datasource:
    # Default to H2 file DB for immediate out-of-the-box local execution
    url: ${DB_URL:jdbc:h2:file:./data/spring_energy_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
