version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: energy_forecast_postgres
    environment:
      POSTGRES_DB: energy_db
      POSTGRES_USER: energy_user
      POSTGRES_PASSWORD: energy_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_user -d energy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: energy_forecast_ml
    ports:
      - "8000:8000"
    environment:
      - DB_URL=sqlite:///data/energy_forecast.db
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energy_forecast_gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - ML_SERVICE_URL=http://ml-service:8000
      - DB_URL=jdbc:postgresql://postgres:5432/energy_db
      - DB_USER=energy_user
      - DB_PASSWORD=energy_secure_password
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energy_forecast_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
